services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: room_booking
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - database-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d room_booking"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      target: build
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@database:5432/room_booking
    depends_on:
      database:
        condition: service_healthy

  api:
    build: .
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@database:5432/room_booking
      JWT_SECRET: ${JWT_SECRET:-local-docker-secret-change-me-in-production}
    ports:
      - "3000:3000"

volumes:
  database-data:
